#
# Throwaway workflow. First round measured four ways of getting the
# browsers onto a runner and the Playwright image won, which is now in
# #8970. This round measures the worker count, which the config pins to
# one on CI, and the two shapes that follow from the answer.
# Delete the branch once the numbers are in.

name: Playwright install benchmark

on:
  push:
    branches: [ ci/measure-playwright-install ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # How far the suite scales across the runner's four cores, and what it
  # costs in flakiness. The whole suite in one job, so nothing but the
  # worker count differs between the rows.
  workers:
    name: workers ${{ matrix.workers }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    env:
      HOME: /root
    strategy:
      fail-fast: false
      matrix:
        workers: [1, 2, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: npm ci

      - name: Run the whole suite
        run: |
          set -o pipefail
          start=$SECONDS
          npm run test:component -- --workers=${{ matrix.workers }} --reporter=list 2>&1 | tee run.log || true
          echo "| ${{ matrix.workers }} worker(s) | $((SECONDS - start))s | $(grep -cE '^\s+✘' run.log || true) failed | $(grep -oE '[0-9]+ flaky' run.log || echo '0 flaky') | $(grep -oE '[0-9]+ passed' run.log | tail -1) |" >> "$GITHUB_STEP_SUMMARY"
          # The run itself still has to pass, retries included
          grep -qE '^\s+[0-9]+ failed' run.log && exit 1 || exit 0

  # The two shapes worth comparing end to end: what #8970 lands, and the
  # one that trades shards for workers so the per-shard setup is paid
  # half as often.
  four-shards-one-worker:
    name: 4 shards x 1 worker (${{ matrix.shard }}/4)
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    env:
      HOME: /root
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: npm ci

      - name: Run the shard
        run: |
          set -o pipefail
          start=$SECONDS
          npm run test:component -- --workers=1 --shard='${{ matrix.shard }}/4' --reporter=list 2>&1 | tee run.log || true
          echo "| 4x1 shard ${{ matrix.shard }} | $((SECONDS - start))s | $(grep -oE '[0-9]+ flaky' run.log || echo '0 flaky') |" >> "$GITHUB_STEP_SUMMARY"
          grep -qE '^\s+[0-9]+ failed' run.log && exit 1 || exit 0

  two-shards-two-workers:
    name: 2 shards x 2 workers (${{ matrix.shard }}/2)
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    env:
      HOME: /root
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: npm ci

      - name: Run the shard
        run: |
          set -o pipefail
          start=$SECONDS
          npm run test:component -- --workers=2 --shard='${{ matrix.shard }}/2' --reporter=list 2>&1 | tee run.log || true
          echo "| 2x2 shard ${{ matrix.shard }} | $((SECONDS - start))s | $(grep -oE '[0-9]+ flaky' run.log || echo '0 flaky') |" >> "$GITHUB_STEP_SUMMARY"
          grep -qE '^\s+[0-9]+ failed' run.log && exit 1 || exit 0
