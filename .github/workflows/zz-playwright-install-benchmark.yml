#
# Throwaway workflow. First round measured four ways of getting the
# browsers onto a runner and the Playwright image won, which is now in
# #8970. This round measures the worker count, which the config pins to
# one on CI, and the two shapes that follow from the answer.
# Delete the branch once the numbers are in.

name: Playwright install benchmark

on:
  push:
    branches: [ ci/measure-playwright-install ]
  workflow_dispatch:

permissions:
  contents: read

# The image's default shell is sh, which has no pipefail and no $SECONDS
defaults:
  run:
    shell: bash

jobs:
  # Round two said workers scale badly on their own (6m19 / 4m49 / 4m22
  # for one, two and four) while four separate runners beat two runners
  # with two workers each. This round asks whether the two stack: more
  # shards, each using more than one of its four idle cores.
  shape:
    name: ${{ matrix.shards }} shards x ${{ matrix.workers }} workers (${{ matrix.shard }})
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    env:
      HOME: /root
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shards: 4, workers: 2, shard: 1 }
          - { shards: 4, workers: 2, shard: 2 }
          - { shards: 4, workers: 2, shard: 3 }
          - { shards: 4, workers: 2, shard: 4 }
          - { shards: 8, workers: 1, shard: 1 }
          - { shards: 8, workers: 1, shard: 2 }
          - { shards: 8, workers: 1, shard: 3 }
          - { shards: 8, workers: 1, shard: 4 }
          - { shards: 8, workers: 1, shard: 5 }
          - { shards: 8, workers: 1, shard: 6 }
          - { shards: 8, workers: 1, shard: 7 }
          - { shards: 8, workers: 1, shard: 8 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: npm ci

      - name: Run the shard
        run: |
          set -o pipefail
          start=$SECONDS
          npm run test:component -- --workers=${{ matrix.workers }} --shard='${{ matrix.shard }}/${{ matrix.shards }}' --reporter=list 2>&1 | tee run.log || true
          echo "| ${{ matrix.shards }}x${{ matrix.workers }} shard ${{ matrix.shard }} | $((SECONDS - start))s | $(grep -oE '[0-9]+ flaky' run.log || echo '0 flaky') | $(grep -oE '[0-9]+ passed' run.log | tail -1) |" >> "$GITHUB_STEP_SUMMARY"
          grep -qE '^\s+[0-9]+ failed' run.log && exit 1 || exit 0
