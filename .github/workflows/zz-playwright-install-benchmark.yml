#
# Throwaway workflow. First round measured four ways of getting the
# browsers onto a runner and the Playwright image won, which is now in
# #8970. This round measures the worker count, which the config pins to
# one on CI, and the two shapes that follow from the answer.
# Delete the branch once the numbers are in.

name: Playwright install benchmark

on:
  push:
    branches: [ ci/measure-playwright-install ]
  workflow_dispatch:

permissions:
  contents: read

# The image's default shell is sh, which has no pipefail and no $SECONDS
defaults:
  run:
    shell: bash

jobs:
  # Round four: what a chromium-only suite would cost and save, the way
  # server runs it. No container, no install step at all, the runner's
  # own Chrome through Playwright's `channel`.
  chrome-only:
    name: chrome only, ${{ matrix.workers }} worker(s)
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workers: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      # What server does in its own config, applied here for the measurement
      - name: Point the chromium project at the runner's Chrome
        run: |
          sed -i "s/\.\.\.devices\['Desktop Chrome'\],/...devices['Desktop Chrome'], channel: 'chrome',/" playwright.config.ts
          grep -n "channel" playwright.config.ts

      - name: Run the suite on chromium alone
        run: |
          set -o pipefail
          start=$SECONDS
          npm run test:component -- --project=chromium --workers=${{ matrix.workers }} --reporter=list 2>&1 | tee run.log || true
          echo "| chrome only, ${{ matrix.workers }} worker(s) | $((SECONDS - start))s | $(grep -oE '[0-9]+ flaky' run.log || echo '0 flaky') | $(grep -oE '[0-9]+ passed' run.log | tail -1) | $(grep -oE '[0-9]+ skipped' run.log | tail -1) |" >> "$GITHUB_STEP_SUMMARY"
          grep -qE '^\s+[0-9]+ failed' run.log && exit 1 || exit 0
